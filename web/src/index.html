<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MSE Copilot</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MSE Copilot: ask your cash-on-delivery settlement data in English or French and get exact, checked figures with their sources.">
  <meta name="theme-color" content="#1D3B72">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MSE Transport">
  <meta property="og:title" content="MSE Copilot: ask your settlement data">
  <meta property="og:description" content="Exact figures, checked against the data, with links to the rows used. Part of the MSE Transport suite.">
  <meta property="og:image" content="/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <script>
    try {
      var t = localStorage.getItem('mse-copilot.theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
