name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (unit, Testcontainers, AI evals, coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Surefire: unit + slice tests. Failsafe: pgvector/WireMock integration tests and the
      # golden-set eval suite (fails below eval.threshold). JaCoCo merged gate: 85% lines.
      - name: mvn verify
        run: ./mvnw -B verify
      - name: Upload coverage and eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            target/site/jacoco/
            target/eval/

  web:
    name: Web (build, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run test:coverage

  e2e:
    name: E2E (Playwright on the compose stack, demo mode)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      # compose builds the settlement platform from ../spring-cod-settlement
      - uses: actions/checkout@v4
        with:
          path: spring-ai-settlement-copilot
      - uses: actions/checkout@v4
        with:
          repository: AmineBenzaazaa/spring-cod-settlement
          path: spring-cod-settlement
      - name: Start the stack
        working-directory: spring-ai-settlement-copilot
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spring-ai-settlement-copilot/web/package-lock.json
      - name: Install Playwright
        working-directory: spring-ai-settlement-copilot/web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: spring-ai-settlement-copilot/web
        run: npx playwright test
      - name: Stack logs on failure
        if: failure()
        working-directory: spring-ai-settlement-copilot
        run: docker compose logs --tail 200 copilot settlement-api settlement-seed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: spring-ai-settlement-copilot/web/playwright-report/
